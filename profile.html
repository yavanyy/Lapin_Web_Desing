<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Профіль — TimeTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 flex flex-col">
  <header class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div><h1 class="text-2xl font-bold text-blue-700">TimeTrack</h1><p class="text-sm text-slate-500">Додаток для обліку робочого часу</p></div>
      <nav class="flex flex-wrap gap-3 text-sm font-medium"><a href="index.html" class="hover:text-blue-700">Головна</a><a href="register.html" class="hover:text-blue-700">Реєстрація</a><a href="login.html" class="hover:text-blue-700">Вхід</a><a href="profile.html" class="text-blue-700">Профіль</a><a href="about.html" class="hover:text-blue-700">Про додаток</a></nav>
    </div>
  </header>

  <main class="flex-grow">
    <section class="max-w-4xl mx-auto px-4 py-10">
      <div class="bg-white rounded-2xl shadow p-8">
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 mb-6">
          <div><h2 class="text-2xl font-bold mb-2">Профіль користувача</h2><p class="text-slate-500">Інформація про користувача подана у табличному вигляді.</p></div>
          <button id="logoutBtn" type="button" class="px-4 py-2 rounded-xl bg-red-100 text-red-700 font-semibold hover:bg-red-200 transition">Вийти</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full border-collapse"><tbody id="profileTable" class="divide-y"></tbody></table>
        </div>
      </div>
    </section>
  </main>

  <footer class="bg-white border-t"><div class="max-w-6xl mx-auto px-4 py-4 text-center text-sm text-slate-500">© 2026 TimeTrack. Лабораторна робота №2 з Web-дизайну.</div></footer>
  <script type="module" src="js/profile.js"></script>
</body>
</html>
