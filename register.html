<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Реєстрація — TimeTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 flex flex-col">
  <header class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div><h1 class="text-2xl font-bold text-blue-700">TimeTrack</h1><p class="text-sm text-slate-500">Додаток для обліку робочого часу</p></div>
      <nav class="flex flex-wrap gap-3 text-sm font-medium"><a href="index.html" class="hover:text-blue-700">Головна</a><a href="register.html" class="text-blue-700">Реєстрація</a><a href="login.html" class="hover:text-blue-700">Вхід</a><a href="profile.html" class="hover:text-blue-700">Профіль</a><a href="about.html" class="hover:text-blue-700">Про додаток</a></nav>
    </div>
  </header>

  <main class="flex-grow flex items-center justify-center px-4 py-10">
    <section class="w-full max-w-xl bg-white rounded-2xl shadow p-8">
      <h2 class="text-2xl font-bold mb-2">Реєстрація користувача</h2>
      <p class="text-slate-500 mb-6">Створіть обліковий запис для ведення журналу робочого часу.</p>
      <form id="registerForm" class="space-y-4">
        <div><label for="name" class="block text-sm font-medium mb-1">Ім’я</label><input id="name" type="text" placeholder="Введіть ім’я" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>
        <div><label for="email" class="block text-sm font-medium mb-1">Email</label><input id="email" type="email" placeholder="example@email.com" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>
        <div><label for="gender" class="block text-sm font-medium mb-1">Стать</label><select id="gender" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500"><option value="">Оберіть стать</option><option>Жіноча</option><option>Чоловіча</option><option>Інше</option></select></div>
        <div><label for="birthDate" class="block text-sm font-medium mb-1">Дата народження</label><input id="birthDate" type="date" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>
        <div><label for="password" class="block text-sm font-medium mb-1">Пароль</label><input id="password" type="password" placeholder="Створіть пароль" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500" /></div>
        <p id="registerMessage" class="hidden rounded-xl px-4 py-3 text-sm"></p>
        <button type="submit" class="w-full bg-blue-700 text-white py-3 rounded-xl font-semibold hover:bg-blue-800 transition">Зареєструватися</button>
      </form>
    </section>
  </main>

  <footer class="bg-white border-t"><div class="max-w-6xl mx-auto px-4 py-4 text-center text-sm text-slate-500">© 2026 TimeTrack. Лабораторна робота №2 з Web-дизайну.</div></footer>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
